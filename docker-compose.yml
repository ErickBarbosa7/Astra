services:
  db:
    image: postgres:16
    container_name: astra-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: astra
      POSTGRES_PASSWORD: astra_dev_password
      POSTGRES_DB: astra
    ports:
      - "5433:5432"
    volumes:
      - astra_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astra -d astra"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  astra_pgdata:
